name: ZAVI ONE ADMIN 1.4.21 compact mobile QA APK
on:
  push:
    branches: [zavi-admin-v1421-compact-trial7-dualdate-qa]
    paths:
      - '.github/workflows/zavi-admin-v1421-qa.yml'
      - 'industry-build/admin-v1421-compact.js'
      - 'industry-build/admin-v1421-compact.css'
      - 'industry-build/prepare_admin_v1421.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-admin-v1421:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          M="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$M" ];then M="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)";fi
          yes | "$M" --licenses >/dev/null || true
          "$M" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Obtain exact SHA-verified admin 1.4.20 binary from private GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          git fetch --no-tags --depth=1 origin zavi-v6573-admin-android-qa
          git show FETCH_HEAD:industry-delivery/ZAVI_ONE_ADMIN_V1_4_20_20_INDUSTRIES_QA.apk > staging/admin-base.apk
          git show FETCH_HEAD:industry-delivery/ZAVI_ONE_ADMIN_V1_4_20_20_INDUSTRIES_QA.apk.sha256 > staging/expected.sha256
          sha="$(awk 'NR==1{print $1}' staging/expected.sha256)"
          echo "$sha  staging/admin-base.apk" | sha256sum -c
          test "$sha" = "a9d55a174c046d7b934f0ba63249c2aa87116de70c0bfaf7f7eb35dc71d4cf2b"
      - name: Preserve complete admin and apply compact design, separate trial and Afghan dates
        shell: bash
        run: |
          set -euo pipefail
          python3 industry-build/prepare_admin_v1421.py --apk staging/admin-base.apk --web android-build/app/src/main/assets
          node --check industry-build/admin-v1421-compact.js
          node --check android-build/app/src/main/assets/zavi-admin-v1421-compact.js
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          a=Path('android-build/app/src/main/assets')
          page=(a/'index.html').read_text()
          assert page.count('zavi-admin-v1421-compact.js')==1
          assert page.count('zavi-admin-v1421-compact.css')==1
          for x in ('account-control.js','admin-portal.js','app.js',
                    'zavi-v6572-admin-trial7.js','zavi-v6570-admin-offline.js',
                    'zavi-admin-industry-overview.js'):
              assert (a/x).is_file()
          j=(a/'zavi-admin-v1421-compact.js').read_text()
          assert 'zavi_admin_grant_trial_7days' in j
          assert "fa-AF-u-ca-persian" in j
          assert "en-GB-u-ca-gregory" in j
          assert 'z421-trial-entry' in j
          assert 'getMode' in j and "'live'" in j
          print('PASS: full ADMIN security preserved, 7d RPC, 2 calendars, compact design')
          PY
      - name: Set isolated signed QA identity (do not overwrite customer's admin)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build/app/build.gradle');s=p.read_text()
          pairs={
              "admin ? 'com.zavione.one.admin' : 'com.zavione.one'":"admin ? 'com.zavione.one.admin.compactqa' : 'com.zavione.one'",
              "versionCode admin ? 4127 : 6554":"versionCode admin ? 142100 : 6554",
              "versionName admin ? '1.3.7' : '65.54'":"versionName admin ? '1.4.21-qa' : '65.54'",
              "admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'":"admin ? 'ZAVI ONE ADMIN QA' : 'ZAVI ONE'"
          }
          for old,new in pairs.items():
              assert s.count(old)==1,old
              s=s.replace(old,new)
          assert 'targetSdk 36' in s and 'signingConfig signingConfigs.debug' in s
          p.write_text(s)
          PY
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cp android-build/icons/admin.webp android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.webp
      - name: Build and check true Android APK
        shell: bash
        run: |
          set -euo pipefail
          (cd android-build && gradle --no-daemon -PzaviApp=admin :app:assembleRelease)
          APK=android-build/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" | grep -F 'Verified using v2 scheme'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.zavione.one.admin.compactqa'"
          unzip -t "$APK" | tail -n 1
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1421-compact.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1421-compact.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-v6572-admin-trial7.js
          unzip -Z1 "$APK" | grep -Fx assets/account-control.js
          mkdir -p industry-delivery
          cp "$APK" industry-delivery/ZAVI_ONE_ADMIN_V1_4_21_COMPACT_TRIAL7_DUAL_DATE_QA.apk
          (cd industry-delivery && sha256sum ZAVI_ONE_ADMIN_V1_4_21_COMPACT_TRIAL7_DUAL_DATE_QA.apk > ZAVI_ONE_ADMIN_V1_4_21_COMPACT_TRIAL7_DUAL_DATE_QA.apk.sha256)
          printf '%s\n' 'QA only: compact mobile header, readable buttons, owner-only separate 7-day trial, Afghan solar Hijri and Gregorian display.' 'Original ZAVI ONE ADMIN backend security and device permissions retained; do not uninstall or remove an existing installation before backup.' 'QA app has its own Android package and temporary debug signing. Real-device visual and end-to-end tests remain required.' > industry-delivery/README_ADMIN_V1421_QA.txt
      - name: Publish private QA APK download
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZAVI ADMIN UI QA CI'
          git config user.email 'zavi-admin-qa@users.noreply.github.com'
          git add industry-delivery/ZAVI_ONE_ADMIN_V1_4_21_COMPACT_TRIAL7_DUAL_DATE_QA.apk industry-delivery/ZAVI_ONE_ADMIN_V1_4_21_COMPACT_TRIAL7_DUAL_DATE_QA.apk.sha256 industry-delivery/README_ADMIN_V1421_QA.txt
          git commit -m 'artifact(admin): v1.4.21 compact header, separated seven-day trials and Afghan dual-date QA APK'
          git push origin HEAD:zavi-admin-v1421-compact-trial7-dualdate-qa
