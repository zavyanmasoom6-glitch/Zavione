          cat > README_DARI.txt <<'EOF'
          ZAVI ONE 65.97 and ADMIN 1.4.43 — reliably visible 46px circular dashboard microphone, light/dark contrast, mobile bottom sheet, real mobile menu routes, voice draft and consent; QA only.
