name: ZAVI ONE V65.97 + ADMIN 1.4.43 Visible Voice Dashboard QA
on:
  push:
    branches: [zavi-v6597-admin1443-visible-voice-fab-qa]
    paths:
      - '.github/workflows/zavi-voice-fab-v6597-qa.yml'
      - 'design-system/**'
      - 'windows-build/build-unified-design-v6597.ps1'
      - 'windows-build/prepare-v6597-desktop.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-both:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Install Android tools
        shell: bash
        run: |
          set -euo pipefail
          M="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$M" ];then M="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)";fi
          yes | "$M" --licenses >/dev/null || true
          "$M" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Obtain original SHA-verified ZAVI ONE 65.83 and owner ADMIN 1.4.29 binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design-staging design-delivery
          cp industry-delivery/ZAVI_ONE_UNIFIED_20_BUSINESSES_V65_83_TRIAL7_REAL_OFFLINE_QA.apk design-staging/one.apk
          sha256sum design-staging/one.apk
          echo 'fee4ae8ec59a8d433f95c631fe26dfd46fcb8d4916aca01ed5b3090cf5a4d018  design-staging/one.apk' | sha256sum -c
          git fetch --no-tags --depth=1 origin zavi-admin-v1429-seven-day-store-offline-qa
          git show FETCH_HEAD:industry-delivery/ZAVI_ONE_ADMIN_V1_4_29_STORE_OFFLINE_7D_QA.apk > design-staging/admin.apk
          echo '4d06d6e76f6e7238ea01b4759f617087c195741267f191d89e0a865aff3f1eea  design-staging/admin.apk' | sha256sum -c
      - name: Bundle offline ZXing scanner for Safari iPad and Windows
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix design-system --no-save --no-package-lock --ignore-scripts --no-audit --no-fund esbuild@0.25.12 @zxing/browser@0.2.1
          ./design-system/node_modules/.bin/esbuild design-system/zavi-zxing-entry-v6591.js --bundle --format=iife --target=es2020 --minify --outfile=design-system/zavi-zxing-bundle-v6591.js
          node --check design-system/zavi-zxing-bundle-v6591.js
          test "$(wc -c < design-system/zavi-zxing-bundle-v6591.js)" -gt 80000
          echo 'PASS locally bundled ZXing decoder; no runtime CDN required'
      - name: Package ZAVI ONE design APK and iPad Safari web PWA
        shell: bash
        run: |
          set -euo pipefail
          python3 design-system/build_android_v6597.py --app one --apk design-staging/one.apk --expected-sha fee4ae8ec59a8d433f95c631fe26dfd46fcb8d4916aca01ed5b3090cf5a4d018
          node --check android-build/app/src/main/assets/zavi-unified-v6584.js
          test -s android-build/app/src/main/assets/zavi-real-viewport-v6586.css
          test -s android-build/app/src/main/assets/zavi-three-sizes-v6588.css
          node --check android-build/app/src/main/assets/zavi-three-sizes-v6588.js
          test -s android-build/app/src/main/assets/zavi-landscape-v6589.css
          node --check android-build/app/src/main/assets/zavi-landscape-v6589.js
          test -s android-build/app/src/main/assets/zavi-mobile-rescue-v6590.css
          node --check android-build/app/src/main/assets/zavi-mobile-rescue-v6590.js
          test -s android-build/app/src/main/assets/zavi-voice-fab-v6597.css
          node --check android-build/app/src/main/assets/zavi-voice-fab-v6597.js
          grep -Fq 'zavi-voice-fab-v6597.js?v=65.97' android-build/app/src/main/assets/index.html
          grep -Fq 'zavi-store-v6597-fab' android-build/app/src/main/assets/sw.js
          node --check design-system/zavi-voice-pro-v6596.js
          node --check design-system/zavi-voice-admin-v1442.js
          node design-system/test_voice_v6596.cjs
          node --check design-system/zavi-voice-fab-v6597.js
          node design-system/test_voice_fab_v6597.cjs
          test -s android-build/app/src/main/assets/zavi-voice-pro-v6596.css
          node --check android-build/app/src/main/assets/zavi-voice-pro-v6596.js
          grep -Fq 'zavi-voice-pro-v6596.js?v=65.96' android-build/app/src/main/assets/index.html
          grep -Fq 'zavi-store-v6597-fab' android-build/app/src/main/assets/sw.js
          grep -Fq 'ZaviAndroidVoice' android-build/app/src/main/java/com/zavione/mobile/MainActivity.java
          grep -Fq 'RecognizerIntent.ACTION_RECOGNIZE_SPEECH' android-build/app/src/main/java/com/zavione/mobile/MainActivity.java
