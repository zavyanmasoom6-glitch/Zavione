name: ZAVI ONE ADMIN V1.4.28 signed 7d offline read-only QA APK
on:
  push:
    branches: [zavi-admin-v1428-offline-seven-days-qa]
    paths:
      - '.github/workflows/zavi-admin-v1428-qa.yml'
      - 'industry-build/admin-v1422-mobile-fix.js'
      - 'industry-build/admin-v1422-mobile-fix.css'
      - 'industry-build/prepare_admin_v1428.py'
      - 'industry-build/admin-v1421-compact.js'
      - 'industry-build/admin-v1423-lifetime.js'
      - 'industry-build/admin-v1423-lifetime.css'
      - 'industry-build/admin-v1422-mobile-fix.js'
      - 'industry-build/admin-v1424-allfix.js'
      - 'industry-build/admin-v1424-allfix.css'
      - 'industry-build/admin-v1425-safe-scale.css'
      - 'industry-build/admin-v1426-drawer.js'
      - 'industry-build/admin-v1426-drawer.css'
      - 'industry-build/admin-v1427-trial-date.css'
      - 'industry-build/admin-v1428-offline-seven-days.js'
      - 'industry-build/admin-v1428-offline-seven-days.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-admin-v1421:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          M="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$M" ];then M="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)";fi
          yes | "$M" --licenses >/dev/null || true
          "$M" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Obtain exact SHA-verified admin 1.4.20 binary from private GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          git fetch --no-tags --depth=1 origin zavi-v6573-admin-android-qa
          git show FETCH_HEAD:industry-delivery/ZAVI_ONE_ADMIN_V1_4_20_20_INDUSTRIES_QA.apk > staging/admin-base.apk
          git show FETCH_HEAD:industry-delivery/ZAVI_ONE_ADMIN_V1_4_20_20_INDUSTRIES_QA.apk.sha256 > staging/expected.sha256
          sha="$(awk 'NR==1{print $1}' staging/expected.sha256)"
          echo "$sha  staging/admin-base.apk" | sha256sum -c
          test "$sha" = "a9d55a174c046d7b934f0ba63249c2aa87116de70c0bfaf7f7eb35dc71d4cf2b"
      - name: Preserve complete admin and apply compact design, separate trial and Afghan dates
        shell: bash
        run: |
          set -euo pipefail
          python3 industry-build/prepare_admin_v1428.py --apk staging/admin-base.apk --web android-build/app/src/main/assets
          node --check industry-build/admin-v1421-compact.js
          node --check industry-build/admin-v1422-mobile-fix.js
          node --check industry-build/admin-v1423-lifetime.js
          node --check industry-build/admin-v1424-allfix.js
          node --check industry-build/admin-v1426-drawer.js
          node --check industry-build/admin-v1428-offline-seven-days.js
          node --check android-build/app/src/main/assets/zavi-admin-v1426-drawer.js
          node --check android-build/app/src/main/assets/zavi-admin-v1424-allfix.js
          node --check android-build/app/src/main/assets/zavi-admin-v1422-mobile-fix.js
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          a=Path('android-build/app/src/main/assets')
          page=(a/'index.html').read_text()
          assert page.count('zavi-admin-v1422-mobile-fix.js')==1
          assert page.count('zavi-admin-v1422-mobile-fix.css')==1
          for x in ('account-control.js','admin-portal.js','app.js',
                    'zavi-v6572-admin-trial7.js','zavi-v6570-admin-offline.js',
                    'zavi-admin-industry-overview.js'):
              assert (a/x).is_file()
          j=(a/'zavi-admin-v1422-mobile-fix.js').read_text()
          trial=(a/'zavi-admin-v1421-compact.js').read_text()
          assert 'zavi_admin_grant_trial_7days' in trial
          assert 'zavi_admin_preview_trial_7days' in trial
          assert 'current_expires_at' in trial and 'proposed_expires_at' in trial
          assert 'unsubscribed' in trial and 'fa-AF-u-ca-persian' in trial
          assert 'zavi-admin-v1427-trial-date.css?v=1.4.27' in page
          assert 'zavi-admin-v1428-offline-seven-days.js?v=1.4.28' in page
          assert 'zavi-admin-v1428-offline-seven-days.css?v=1.4.28' in page
          offline=(a/'zavi-admin-v1428-offline-seven-days.js').read_text()
          assert 'zavi-admin-offline-grace' in offline
          assert 'crypto.subtle.verify' in offline
          assert 'p.exp-p.iat>7*86400' in offline
          assert 'can_write!==false' in offline and 'readonly!==true' in offline
          style=(a/'zavi-admin-v1427-trial-date.css').read_text()
          assert '.z427-date-line' in style and '.z427-error' in style and 'data-zavi-theme="dark"' in style
          assert 'guardScale' in j and 'translateNavigation' in j and 'closeDrawer' in j
          assert 'zavi1422-early-mobile-viewport' in page
          assert 'zavi-admin-v1424-allfix.js?v=1.4.24' in page
          assert 'zavi-admin-v1425-safe-scale.css?v=1.4.25' in page
          assert page.count('zavi-admin-v1426-drawer.css?v=1.4.26') == 1
          assert page.count('zavi-admin-v1426-drawer.js?v=1.4.26') == 1
          fix_css=(a/'zavi-admin-v1426-drawer.css').read_text()
          fix_js=(a/'zavi-admin-v1426-drawer.js').read_text()
          assert 'transform:translate3d(105%,0,0)!important' in fix_css
          assert 'transform:translate3d(-105%,0,0)!important' in fix_css
          assert 'z426-drawer-close' in fix_js and 'z426-drawer-backdrop' in fix_js
          assert "e.stopImmediatePropagation()" in fix_js
          assert 'touchend' in fix_js and "e.key==='Escape'" in fix_js
          assert page.index('zavi-admin-v1425-safe-scale.css') < page.index('zavi-admin-v1426-drawer.css')
          safe=(a/'zavi-admin-v1424-allfix.js').read_text()
          assert "root.style.setProperty('zoom'" not in safe
          assert "(100/(v/100))" not in safe
          assert "--z425-ui-scale" in safe and 'z425Enlarged' in safe
          assert (a/'zavi-admin-v1425-safe-scale.css').is_file()
          assert 'grid-template-columns:minmax(0,1fr)!important' in (a/'zavi-admin-v1425-safe-scale.css').read_text()
          assert 'zavi-admin-v1424-allfix.css?v=1.4.24' in page
          assert (a/'zavi-admin-v1424-allfix.css').is_file()
          patch=(a/'zavi-admin-v1424-allfix.js').read_text()
          assert "50" in patch and "150" in patch and 'z424-responsive-table' in patch
          assert 'z424-lang-button' in patch and 'zoomUI' in patch
          assert "fa-AF-u-ca-persian" in (a/"zavi-admin-v1421-compact.js").read_text()
          assert "en-GB-u-ca-gregory" in (a/"zavi-admin-v1421-compact.js").read_text()
          assert 'z421-trial-entry' in (a/'zavi-admin-v1421-compact.js').read_text()
          assert (a/'zavi-admin-v1423-lifetime.js').is_file()
          lifetime=(a/'zavi-admin-v1423-lifetime.js').read_text()
          assert 'zavi_admin_grant_lifetime' in lifetime and 'zavi_admin_revoke_lifetime' in lifetime
          assert "p_confirmation:'LIFETIME-REVOKE'" in lifetime
          assert 'getMode' in lifetime and 'LIFETIME-REVOKE' in lifetime
          assert 'getMode' in (a/'zavi-admin-v1421-compact.js').read_text() and "'live'" in (a/'zavi-admin-v1421-compact.js').read_text()
          print('PASS: full ADMIN security preserved, 7d RPC, 2 calendars, compact design')
          PY
      - name: Set isolated signed QA identity (do not overwrite customer's admin)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build/app/build.gradle');s=p.read_text()
          pairs={
              "admin ? 'com.zavione.one.admin' : 'com.zavione.one'":"admin ? 'com.zavione.one.admin.offline1428qa' : 'com.zavione.one'",
              "versionCode admin ? 4127 : 6554":"versionCode admin ? 142800 : 6554",
              "versionName admin ? '1.3.7' : '65.54'":"versionName admin ? '1.4.28-qa' : '65.54'",
              "admin ? 'ZAVI ONE ADMIN' : 'ZAVI ONE'":"admin ? 'ZAVI ONE ADMIN QA' : 'ZAVI ONE'"
          }
          for old,new in pairs.items():
              assert s.count(old)==1,old
              s=s.replace(old,new)
          assert 'targetSdk 36' in s and 'signingConfig signingConfigs.debug' in s
          p.write_text(s)
          PY
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cp android-build/icons/admin.webp android-build/app/src/main/res/drawable-nodpi/zavi_launcher_image.webp
      - name: Build and check true Android APK
        shell: bash
        run: |
          set -euo pipefail
          (cd android-build && gradle --no-daemon -PzaviApp=admin :app:assembleRelease)
          APK=android-build/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" | grep -F 'Verified using v2 scheme'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.zavione.one.admin.offline1428qa'"
          unzip -t "$APK" | tail -n 1
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1421-compact.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1422-mobile-fix.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1422-mobile-fix.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1422-manifest.json
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1423-lifetime.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1424-allfix.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1424-allfix.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1425-safe-scale.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1426-drawer.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1426-drawer.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1427-trial-date.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1428-offline-seven-days.js
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1428-offline-seven-days.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-admin-v1423-lifetime.css
          unzip -Z1 "$APK" | grep -Fx assets/zavi-v6572-admin-trial7.js
          unzip -Z1 "$APK" | grep -Fx assets/account-control.js
          mkdir -p industry-delivery
          cp "$APK" industry-delivery/ZAVI_ONE_ADMIN_V1_4_28_OFFLINE_7D_QA.apk
          (cd industry-delivery && sha256sum ZAVI_ONE_ADMIN_V1_4_28_OFFLINE_7D_QA.apk > ZAVI_ONE_ADMIN_V1_4_28_OFFLINE_7D_QA.apk.sha256)
          printf '%s\n' 'QA: automatic ES256 7-day owner-only ADMIN OFFLINE READ-ONLY grace; no offline server-side modifications; previous trial, dark/light and menu fixes retained.' 'Original ZAVI ONE ADMIN backend security and device permissions retained; do not uninstall or remove an existing installation before backup.' 'QA app has its own Android package and temporary debug signing. Real-device visual and end-to-end tests remain required.' > industry-delivery/README_ADMIN_V1428_QA.txt
      - name: Prepare iPad Safari owner-only web PWA ZIP (NOT an IPA)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          web=Path("android-build/app/src/main/assets")
          for f in ("index.html","zavi-admin-v1423-lifetime.js","zavi-admin-v1423-lifetime.css","zavi-admin-v1424-allfix.js","zavi-admin-v1424-allfix.css","zavi-admin-v1425-safe-scale.css","zavi-admin-v1426-drawer.css","zavi-admin-v1426-drawer.js","zavi-admin-v1427-trial-date.css","zavi-admin-v1428-offline-seven-days.js","zavi-admin-v1428-offline-seven-days.css"):
              assert (web/f).is_file(),f
          out=Path("industry-delivery/ZAVI_ONE_ADMIN_V1_4_28_IPAD_WEB_QA.zip")
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for p in web.rglob("*"):
                  if p.is_file() and not p.name.startswith("."):z.write(p,p.relative_to(web).as_posix())
          with zipfile.ZipFile(out) as z:assert "index.html" in z.namelist()
          PY
          (cd industry-delivery && sha256sum ZAVI_ONE_ADMIN_V1_4_28_IPAD_WEB_QA.zip > ZAVI_ONE_ADMIN_V1_4_28_IPAD_WEB_QA.zip.sha256)
      - name: Publish private QA APK download
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZAVI ADMIN UI QA CI'
          git config user.email 'zavi-admin-qa@users.noreply.github.com'
          git add industry-delivery/ZAVI_ONE_ADMIN_V1_4_28_OFFLINE_7D_QA.apk industry-delivery/ZAVI_ONE_ADMIN_V1_4_28_OFFLINE_7D_QA.apk.sha256 industry-delivery/README_ADMIN_V1428_QA.txt industry-delivery/ZAVI_ONE_ADMIN_V1_4_28_IPAD_WEB_QA.zip industry-delivery/ZAVI_ONE_ADMIN_V1_4_28_IPAD_WEB_QA.zip.sha256
          git commit -m 'artifact(admin): v1.4.28 signed seven-day offline owner read-only grace QA APK'
          git push origin HEAD:zavi-admin-v1428-offline-seven-days-qa
