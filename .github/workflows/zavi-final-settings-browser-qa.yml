name: ZAVI ONE clean Settings browser acceptance QA
on:
  push:
    branches: [zavi-final-settings-ui-20261025]
    paths: [".github/workflows/zavi-final-settings-browser-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual browser testing harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          npm install --no-audit --no-fund --no-save --prefix /tmp/zavi-clean-test playwright-core@1.58.2
          node --check android-build/patches/zavi-final-settings-store-v6559.js
          node --check android-build/patches/zavi-final-settings-admin-v1410.js
          node --check android-build/patches/zavi-final-settings-visual-qa.cjs
      - name: Browser test all settings groups, search, removal, rerender, translations
        env:
          NODE_PATH: /tmp/zavi-clean-test/node_modules
        run: |
          set -euo pipefail
          node android-build/patches/zavi-final-settings-visual-qa.cjs
